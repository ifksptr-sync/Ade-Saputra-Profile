<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tools — Ade Saputra</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  .hero-tools{padding:120px 24px 60px;max-width:1200px;margin:0 auto}
  .hero-tools h1{font-family:'Fraunces',serif;font-size:clamp(2.2rem,5vw,3.5rem);font-weight:700;letter-spacing:-.04em;color:var(--ink);margin:0 0 12px;line-height:1.05}
  .hero-tools p.lead{font-size:1.05rem;line-height:1.75;color:var(--muted);max-width:680px;margin:0 0 40px}
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .tool-card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:26px;transition:.22s;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(15,23,42,.05)}
  .tool-card:hover{transform:translateY(-4px);border-color:rgba(37,99,235,.32);box-shadow:0 20px 44px rgba(15,23,42,.10)}
  .tool-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--blue-2));display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:18px}
  .tool-card h3{font-size:1.2rem;font-weight:900;color:var(--ink);margin:0 0 8px;letter-spacing:-.02em}
  .tool-card .desc{font-size:.9rem;line-height:1.6;color:var(--muted);margin:0 0 20px;flex:1}
  .tool-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.72rem;font-weight:800;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
  .badge-available{background:rgba(16,185,129,.12);color:#059669}
  .badge-soon{background:rgba(107,114,128,.12);color:#6b7280}
  .tool-actions{display:flex;gap:10px;margin-top:auto}
  .tool-actions .btn{flex:1;justify-content:center;padding:11px 16px;font-size:.85rem}
  .btn-trial{background:linear-gradient(135deg,var(--blue-2),var(--navy));color:#fff;border:0;border-radius:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn-trial:hover{transform:translateY(-1px);text-decoration:none}
  .btn-detail{background:var(--paper-soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn-detail:hover{background:var(--bg);text-decoration:none}
  .back-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem;font-weight:700;margin-bottom:28px;text-decoration:none}
  .back-link:hover{color:var(--blue)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="brand" style="text-decoration:none">
      <div class="logo">AS</div>
      <span>Ade Saputra</span>
    </a>
    <div class="nav-actions">
      <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>
      <a href="login.html" class="logout-btn" style="text-decoration:none;color:var(--ink)">Login</a>
    </div>
  </div>
</nav>

<section class="hero-tools">
  <a href="../index.html" class="back-link">← Kembali ke Portofolio</a>
  <h1>Tools & Products</h1>
  <p class="lead">
    Kumpulan tools otomasi untuk mempercepat pekerjaan accounting, tax, dan finance.
    Setiap tool bisa dicoba <b>gratis 3 Hari</b> — tanpa kartu kredit.
  </p>

  <div id="toolsGrid" class="tools-grid">
    <div class="empty-state">Memuat tools...</div>
  </div>
</section>

<script src="app.js"></script>
<script>
  // Theme toggle
  const themeBtn = document.getElementById('themeToggle');
  const html = document.documentElement;
  const savedTheme = localStorage.getItem('theme') || 'light';
  html.setAttribute('data-theme', savedTheme);
  themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const cur = html.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  // Load tools dari backend
  (async () => {
    const grid = document.getElementById('toolsGrid');
    try {
      const res = await fetch(API_URL + '/api/tools');
      const data = await res.json();
      if (!data.tools || !data.tools.length) {
        grid.innerHTML = '<div class="empty-state">Belum ada tools tersedia.</div>';
        return;
      }

      const iconMap = {
        'receipt': '🧾',
        'file': '📄',
        'chart': '📊',
        'default': '⚙️'
      };

      grid.innerHTML = data.tools.map(tool => {
        const isAvailable = tool.status === 'available';
        const badge = isAvailable
          ? '<span class="tool-badge badge-available">● Tersedia</span>'
          : '<span class="tool-badge badge-soon">● Segera</span>';

        const actions = isAvailable
          ? `<a href="trial.html?tool=${tool.id}" class="btn-trial">🚀 Coba Gratis ${tool.trial_days} Hari</a>`
          : `<span class="btn-detail" style="opacity:.5;cursor:not-allowed">Coming Soon</span>`;

        return `
          <div class="tool-card">
            <div class="tool-icon">${iconMap[tool.icon] || iconMap.default}</div>
            ${badge}
            <h3>${tool.name}</h3>
            <p class="desc">${tool.description}</p>
            <div class="tool-actions">
              ${actions}
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      grid.innerHTML = `<div class="empty-state">Gagal memuat tools: ${e.message}</div>`;
    }
  })();
</script>
</body>
</html>
